site_name: TLC Church-Wide Child and Youth Safety Policy
site_description: Thanh Le Church - Church-Wide Child and Youth Safety Policy Manual
site_author: Thanh Le Church
site_url: https://thanhlechurch.github.io/child-youth-safety-policy/
docs_dir: docs
repo_url: https://github.com/thanhlechurch/child-youth-safety-policy
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: red
      accent: red
  font:
    text: DM Sans
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
    - content.action.edit

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Preamble: preamble.md
  - Document Control: document-control.md
  - Articles:
    - Overview: articles/index.md
    - Article I - Purpose, Scope, Definitions, and Governance:
      - Overview: article-i/index.md
      - Section 1 - Purpose, Authority, and Policy Hierarchy: article-i/section-01-purpose-authority-and-policy-hierarchy.md
      - Section 2 - Biblical and Theological Foundation: article-i/section-02-biblical-and-theological-foundation.md
      - Section 3 - Scope and Applicability: article-i/section-03-scope-and-applicability.md
      - Section 4 - Definitions: article-i/section-04-definitions.md
      - Section 5 - Governance and Safeguarding Responsibilities: article-i/section-05-governance-and-safeguarding-responsibilities.md
      - Section 6 - Conflicts of Interest and Concerns Involving Senior Leaders: article-i/section-06-conflicts-of-interest-and-concerns-involving-senior-leaders.md
    - Article II - Staff and Volunteer Eligibility, Screening, and Training:
      - Overview: article-ii/index.md
      - Section 7 - Staff and Volunteer Classifications and Eligibility: article-ii/section-07-worker-classifications-and-eligibility.md
      - Section 8 - Screening and Selection: article-ii/section-08-screening-and-selection.md
      - Section 9 - Background Checks and Ongoing Eligibility: article-ii/section-09-background-checks-and-ongoing-eligibility.md
