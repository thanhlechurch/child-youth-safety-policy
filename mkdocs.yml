    - Appendix A - Immediate Response Guide: appendices/appendix-a.md
    - Appendix B - Reporting And Escalation Directory: appendices/appendix-b.md
    - Appendix C - Screening, Training, and Renewal Matrix: appendices/appendix-c.md
    - Appendix D - Interim Protective Action Matrix: appendices/appendix-d.md
    - Appendix E - Leadership Decisions Before Adoption: appendices/appendix-e.md
