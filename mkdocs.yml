      - Section 36 - Transitional Implementation Plan: article-ix/section-36-transitional-implementation-plan.md
      - Section 37 - Policy Acknowledgment and Ministry-Specific Handbooks: article-ix/section-37-policy-acknowledgment-and-ministry-specific-handbooks.md
  - Appendices:
